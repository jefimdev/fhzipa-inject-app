<svg width="1722" height="3180" viewBox="-287 0 574 1060" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1e23"/>
      <stop offset="0.028" stop-color="#c2c9d1"/>
      <stop offset="0.065" stop-color="#4d535b"/>
      <stop offset="0.16" stop-color="#272b31"/>
      <stop offset="0.5" stop-color="#1a1d22"/>
      <stop offset="0.84" stop-color="#2c3138"/>
      <stop offset="0.93" stop-color="#929aa3"/>
      <stop offset="0.972" stop-color="#4a5058"/>
      <stop offset="1" stop-color="#17191d"/>
    </linearGradient>
    <linearGradient id="frameTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8e959d"/>
      <stop offset="0.07" stop-color="#282c32"/>
      <stop offset="0.5" stop-color="#1c1f24"/>
      <stop offset="0.93" stop-color="#23272d"/>
      <stop offset="1" stop-color="#6d747c"/>
    </linearGradient>
    <linearGradient id="backGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#474c54"/>
      <stop offset="0.18" stop-color="#32373e"/>
      <stop offset="0.46" stop-color="#24282e"/>
      <stop offset="0.74" stop-color="#282c32"/>
      <stop offset="1" stop-color="#343941"/>
    </linearGradient>
    <linearGradient id="topLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="0.42" stop-color="#ffffff" stop-opacity="0.03"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="redBounce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2343" stop-opacity="0"/>
      <stop offset="1" stop-color="#ff2343" stop-opacity="0.06"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.16" r="0.78">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.09"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="plateau" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#464c55"/>
      <stop offset="0.4" stop-color="#2c3036"/>
      <stop offset="1" stop-color="#1d2025"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#5a6a86"/>
      <stop offset="0.28" stop-color="#202835"/>
      <stop offset="0.7" stop-color="#0b0e14"/>
      <stop offset="1" stop-color="#05070a"/>
    </radialGradient>
    <radialGradient id="lensRing" cx="0.35" cy="0.28" r="0.85">
      <stop offset="0" stop-color="#b6bcc4"/>
      <stop offset="0.4" stop-color="#666c74"/>
      <stop offset="0.75" stop-color="#2f3339"/>
      <stop offset="1" stop-color="#171a1e"/>
    </radialGradient>
    <radialGradient id="flash" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#fff6e2"/>
      <stop offset="0.45" stop-color="#d8cdb6"/>
      <stop offset="1" stop-color="#4a4438"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b81" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#ff2343" stop-opacity="0.8"/>
      <stop offset="0.6" stop-color="#ff2343" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#ff2343" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2343" stop-opacity="0.4"/>
      <stop offset="0.4" stop-color="#ff2343" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#ff2343" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#000000" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="reflectionFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
    <filter id="softer" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="34"/>
    </filter>
    <filter id="rimGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="specular" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>

    <mask id="reflectionMask">
      <rect x="-267" y="960" width="534" height="64" fill="url(#reflectionFade)"/>
    </mask>

    <g id="phone">
      <rect x="-227" y="40" width="454" height="920" rx="114" fill="url(#frame)"/>
      <rect x="-227" y="40" width="454" height="920" rx="114" fill="url(#frameTop)" opacity="0.38"/>
      <rect x="-214" y="53" width="428" height="894" rx="91" fill="url(#backGlass)"/>
      <rect x="-214" y="53" width="428" height="894" rx="91" fill="url(#topLight)"/>
      <rect x="-214" y="53" width="428" height="894" rx="91" fill="url(#redBounce)"/>
      <rect x="-214" y="53" width="428" height="894" rx="91" fill="url(#sheen)"/>

      <!-- red rim light along the left edge and top -->
      <path d="M-224 108 Q-224 43 -165 43 L-51 43" stroke="url(#rim)" stroke-width="7.5" stroke-linecap="round" fill="none" filter="url(#rimGlow)"/>
      <path d="M-224 104 L-224 900 Q-224 957 -165 957" stroke="url(#rim)" stroke-width="8" stroke-linecap="round" fill="none" filter="url(#rimGlow)"/>
      <path d="M-223 120 L-223 880" stroke="#ff8095" stroke-width="1.8" stroke-linecap="round" opacity="0.7"/>

      <!-- side buttons -->
      <rect x="-231" y="196" width="7" height="34" rx="3.5" fill="#5e646d"/>
      <rect x="-231" y="258" width="7" height="66" rx="3.5" fill="#5e646d"/>
      <rect x="-231" y="340" width="7" height="66" rx="3.5" fill="#5e646d"/>
      <rect x="224" y="286" width="7" height="94" rx="3.5" fill="#4c525b"/>

      <!-- camera module -->

      <rect x="-202" y="65" width="78" height="150" rx="26" fill="#0e1114" opacity="0.75"/>
      
        <circle cx="-163" cy="104" r="30" fill="#0b0d10"/>
        <circle cx="-163" cy="104" r="28" fill="url(#lensRing)"/>
        <circle cx="-163" cy="104" r="24" fill="#07090c"/>
        <circle cx="-163" cy="104" r="22" fill="url(#lensGlass)"/>
        <ellipse cx="-174.4" cy="91.4" rx="10.200000000000001" ry="6.3" fill="#a8c9ff" opacity="0.38" filter="url(#specular)" transform="rotate(-35 -174.4 91.4)"/>
        <circle cx="-151.6" cy="117.2" r="4.2" fill="#ff7a90" opacity="0.4"/>
      
        <circle cx="-163" cy="174" r="30" fill="#0b0d10"/>
        <circle cx="-163" cy="174" r="28" fill="url(#lensRing)"/>
        <circle cx="-163" cy="174" r="24" fill="#07090c"/>
        <circle cx="-163" cy="174" r="22" fill="url(#lensGlass)"/>
        <ellipse cx="-174.4" cy="161.4" rx="10.200000000000001" ry="6.3" fill="#a8c9ff" opacity="0.38" filter="url(#specular)" transform="rotate(-35 -174.4 161.4)"/>
        <circle cx="-151.6" cy="187.2" r="4.2" fill="#ff7a90" opacity="0.4"/>
      <path d="M-195 110 Q-195 72 -157 72 L-81 72" stroke="url(#rim)" stroke-width="3.5" stroke-linecap="round" fill="none" filter="url(#rimGlow)" opacity="0.8"/>
      <path d="M-197 140 Q-197 68 -127 68" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.6" fill="none"/>

      <!-- apple logo, debossed on the glass -->
      <g transform="translate(0 380) scale(1.35)" fill="#8a919b" opacity="0.17">
        <path d="M12.9 8.6c.02-2.2 1.8-3.3 1.9-3.3-1-1.5-2.6-1.7-3.2-1.7-1.4-.1-2.7.8-3.3.8-.7 0-1.7-.8-2.8-.8C4 3.6 2.4 4.6 1.6 6.1-.1 9.1 1.1 13.2 2.7 15.8c.8 1.2 1.7 2.6 2.9 2.5 1.2 0 1.6-.7 3-.7s1.8.7 3 .7c1.2 0 2-1.2 2.8-2.4.9-1.4 1.2-2.7 1.2-2.8-.1 0-2.5-.9-2.5-3.9z"/>
        <path d="M10.8 2.4c.6-.7 1-1.6.9-2.5-.9 0-2 .6-2.6 1.3-.6.6-1.1 1.6-.9 2.5 1 .1 2-.5 2.6-1.3z"/>
      </g>

      <!-- specular edge highlights -->
      <path d="M-215 120 L-215 880" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M215 120 L215 880" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.4" stroke-linecap="round"/>
    </g>
  </defs>

  <!-- ambient red halo behind the device -->
  <ellipse cx="8" cy="900" rx="336" ry="150" fill="url(#halo)" filter="url(#softer)"/>
  <ellipse cx="-48" cy="220" rx="112" ry="180" fill="url(#halo)" opacity="0.38" filter="url(#softer)"/>

  <!-- the shadow on the floor, the device is standing on it -->
  <ellipse cx="0" cy="964" rx="300" ry="16" fill="url(#shadow)" filter="url(#soft)"/>
  <ellipse cx="-12" cy="972" rx="263" ry="9" fill="#ff2343" opacity="0.16" filter="url(#soft)"/>

  <!-- mirrored reflection on the floor -->
  <g mask="url(#reflectionMask)" opacity="0.3">
    <use href="#phone" transform="translate(0 1920) scale(1 -1)"/>
  </g>

  <use href="#phone"/>

  <!-- red bloom wrapping the silhouette -->
  <rect x="-225" y="42" width="450" height="916" rx="109" stroke="#ff2343" stroke-width="9" opacity="0.16" filter="url(#soft)"/>
</svg>
