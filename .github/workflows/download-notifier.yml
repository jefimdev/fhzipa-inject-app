name: Download Notifier

# Watches the release counters and reports every new download of the
# FHZIPA INJECT installer. The state file keeps the previous counters so only
# the difference is reported.

on:
  schedule:
    # every hour, a few minutes past the hour
    - cron: "17 * * * *"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check the download counters
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node .github/scripts/check-downloads.mjs

      - name: Keep the counters up to date
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add download-state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update the download counters"
            git push
          fi
